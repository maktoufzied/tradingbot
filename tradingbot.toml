# Trading Bot Configuration
# ========================
# All settings have sensible defaults - only override what you need.

[tradingbot]

# =============================================================================
# STRATEGY - Everything a preset can override
# =============================================================================
[tradingbot.strategy]
# Use a preset to configure everything at once:
# preset = "balanced"  # Options: conservative, balanced, aggressive, scalping, mean_reversion, momentum, divergence

# Or configure individually:
entry = "swing_break"        # Entry: swing_break, vwap_reversion, orb, rsi_divergence, atr_breakout
exit = "swing"               # Exit: swing, atr, fixed

# Timeframe (CLI args override these)
interval = "1h"              # Bar interval: 1m, 5m, 15m, 1h, 1d
period = "1y"                # History: 1mo, 3mo, 6mo, 1y, 2y

# Risk parameters
swing_lb = 5                 # Swing lookback period (bars)
risk_pct = 0.01              # Risk per trade (1% = 0.01)
rr_ratio = 1.5               # Reward/risk ratio (1.5:1 requires ~55% win rate)
allow_short = false          # Allow short selling
atr_sizing = false           # Volatility-adjusted position sizing

# Partial exits: take profits at intermediate R-multiples (empty = all-or-nothing)
# partial_exit_levels = [
#     {r_multiple = 1.0, exit_pct = 0.5},   # Exit 50% at 1R
#     {r_multiple = 2.0, exit_pct = 0.25},  # Exit 25% at 2R
# ]

# Time-based exits (for day trading)
eod_exit = true              # Close all positions before market close
eod_exit_minutes_before = 15 # Minutes before close to trigger EOD exit
time_exit_minutes = 0        # Close position after N minutes (0 = disabled)

# Indicator filters for entry signals
[tradingbot.strategy.indicators]
enabled = ["rsi", "macd"]    # Indicators: rsi, macd
filter_mode = "all"          # "all" = all must pass, "any" = one must pass
signal_mode = "filter"       # "filter" = filter entry signals, "none" = disabled

[tradingbot.strategy.indicators.rsi]
period = 14
overbought = 70.0
oversold = 30.0

[tradingbot.strategy.indicators.macd]
fast_period = 12
slow_period = 26
signal_period = 9

# =============================================================================
# BOT - Account-level settings
# =============================================================================
[tradingbot.bot]
# Capital is fetched from broker for live trading.
# For backtesting, use --capital or --budget CLI flags.

# =============================================================================
# CACHE - Local market data storage (source derived from engine.provider)
# =============================================================================
[tradingbot.cache]
enabled = true
path = "~/.cache/tradingbot/tradingbot.duckdb"

# Retention policy: days to keep data per interval (-1 = forever)
[tradingbot.cache.retention]
"1m" = 7
"5m" = 30
"15m" = 90
"1h" = 365
"1d" = -1

# =============================================================================
# ENGINE - Trading provider configuration
# =============================================================================
[tradingbot.engine]
provider = "alpaca"          # Provider: alpaca, paper, yahoo
bar_interval = "5m"          # Bar interval: 1m, 5m, 15m

[tradingbot.engine.risk]
max_daily_loss_pct = 0.05    # Stop trading after 5% daily loss
circuit_breaker_loss_pct = 0.03  # Pause after 3% loss
max_open_positions = 5       # Max concurrent positions
max_position_size_pct = 0.10 # Max 10% of equity per position
trading_hours_only = true    # Only trade 9:30 AM - 4:00 PM ET

[tradingbot.engine.alpaca]
# API keys via environment variables:
#   export ALPACA_API_KEY="your-api-key"
#   export ALPACA_SECRET_KEY="your-secret-key"
paper = true                 # Use paper trading endpoint
# Execution costs (Alpaca has zero commission)
# spread_bps = 0.0
# slippage_bps = 0.0
# commission_per_share = 0.0

[tradingbot.engine.paper]
# Execution costs for paper/backtest (default: zero)
# spread_bps = 2.0
# slippage_bps = 5.0
# commission_per_share = 0.005

# =============================================================================
# LOGGING - Log level and optional file output
# =============================================================================
[tradingbot.logging]
level = "INFO"                   # DEBUG, INFO, WARNING, ERROR
log_file = "~/.tradingbot/logs/trading.log"  # Optional file output

# =============================================================================
# CUSTOM PRESETS - Define your own trading configurations
# =============================================================================
# [tradingbot.presets.my_preset]
# description = "My custom strategy"
# interval = "1h"            # Timeframe
# period = "1y"              # History
# entry = "swing_break"      # Entry strategy
# exit = "atr"               # Exit strategy
# risk_pct = 0.015           # Risk per trade
# rr_ratio = 2.0             # Reward/risk ratio
# indicators = ["rsi"]       # Indicator filters
# filter_mode = "all"        # Filter mode
# eod_exit = true            # EOD exit
# time_exit_minutes = 0      # Time-based exit
# partial_exit_levels = [    # Partial exits
#     {r_multiple = 1.0, exit_pct = 0.5},
#     {r_multiple = 2.0, exit_pct = 0.3},
# ]

# APLD preset - optimized 2025-12-29 with walk-forward validation
# ⚠ Warning: High overfitting risk detected (75% degradation)
# Using conservative risk (1%) instead of optimized (2%)
[tradingbot.presets.apld]
description = "APLD"
interval = "5m"
period = "1mo"
entry = "swing_break"
exit = "swing"
swing_lb = 3                 # Consensus across all folds
risk_pct = 0.02              # Conservative (optimized was 2%, but high degradation)
rr_ratio = 2.0               # Consensus from folds 2 & 3
eod_exit = false
# indicators = ["adx"]         # Only trade when trending (ADX > 25)
# filter_mode = "all"
# partial_exit_levels = [
#     {r_multiple = 1.0, exit_pct = 0.5},  # Exit 50% at 1R, move stop to breakeven
# ]

