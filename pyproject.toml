[project]
name = "tradingbot"
version = "0.1.0"
description = "Market structure trading bot with backtesting using Yahoo Finance data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alpaca-py>=0.30.0",
    "duckdb>=1.1.0",
    "optuna>=4.6.0",
    "plotext>=5.3.2",
    "polars>=1.35.2",
    "pyarrow>=19.0.0",
    "rich>=14.2.0",
    "textual>=6.7.0",
    "tomlkit>=0.13.3",
    "websockets>=15.0",
    "yfinance>=0.2.66",
]

[project.scripts]
tradingbot-backtest = "tradingbot.backtest_cli:main"
tradingbot-optimize = "tradingbot.optimize_cli:main"
tradingbot-optuna = "tradingbot.optuna_cli:main"
tradingbot-live = "tradingbot.cli:main"
tradingbot-cache = "tradingbot.cache_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.7",
    "pre-commit>=4.5.0",
    "mypy>=1.19.0",
    "pandas-stubs>=2.3.3.251219",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
files = ["src/tradingbot"]

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "plotext", "plotext.*", "optuna", "optuna.*", "tomlkit", "tomlkit.*"]
ignore_missing_imports = true
